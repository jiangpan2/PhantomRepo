name: 更新 Packages 索引

on:
  push:
    branches: [ main ]
    paths:
      - 'debs/**'
      - '.github/workflows/update-packages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: 生成 Packages 索引
        run: |
          > Packages
          count=0
          skipped=0
          
          for deb in debs/*.deb debs/**/*.deb; do
            [ -f "$deb" ] || continue
            
            # 提取control信息
            control=$(dpkg-deb -I "$deb" control 2>/dev/null)
            if [ $? -ne 0 ] || [ -z "$control" ]; then
              echo "⚠️  跳过损坏的包: $deb"
              skipped=$((skipped + 1))
              continue
            fi
            
            # 获取文件大小
            size=$(stat -c%s "$deb" 2>/dev/null || stat -f%z "$deb" 2>/dev/null)
            
            # 计算MD5和SHA
            md5=$(md5sum "$deb" | cut -d' ' -f1)
            sha1=$(sha1sum "$deb" | cut -d' ' -f1)
            sha256=$(sha256sum "$deb" | cut -d' ' -f1)
            
            # 写入Packages
            echo "$control" >> Packages
            echo "Filename: ./$deb" >> Packages
            echo "Size: $size" >> Packages
            echo "MD5sum: $md5" >> Packages
            echo "SHA1: $sha1" >> Packages
            echo "SHA256: $sha256" >> Packages
            echo "" >> Packages
            
            count=$((count + 1))
            echo "✅ 已添加: $(basename $deb)"
          done
          
          gzip -k -f Packages
          echo ""
          echo "========================================"
          echo "Packages 索引生成完成"
          echo "成功: $count 个包"
          echo "跳过: $skipped 个包"
          echo "========================================"

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz
          if git diff --cached --quiet; then
            echo "索引无变化，跳过提交"
          else
            git commit -m "自动更新 Packages 索引"
            git push
            echo "索引已更新并推送"
          fi
